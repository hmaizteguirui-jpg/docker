version: "3.8"

services:
  uploader:
    image: filebrowser/filebrowser:v2.23.0
    container_name: uploader
    volumes:
      - ${RUTA_BASE}:/srv
    ports:
      - "${PORT_FILEBROWSER}:80"  
    restart: unless-stopped
      
  firefox:
    image: jlesage/firefox   # <--- ¡ERROR AQUÍ! Falta algo al final...
    ports:
      - "${PORT_FIREFOX}:5800"